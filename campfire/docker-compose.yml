# 篝火整理的单机部署文件：api + worker + 下载器 + PostgreSQL + Redis。
# 用法：cp .env.example .env，填好 .env 后执行 docker compose up -d，再看 docker compose logs api 里的首次设置链接。
name: dtk

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: ghcr.io/campfire-code/douyin-downloader:${DTK_IMAGE_TAG:-latest}
  env_file: .env
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  mem_limit: 512m
  memswap_limit: 512m
  cpus: 2.0
  pids_limit: 256
  logging: *logging

services:
  postgres:
    image: timescale/timescaledb-ha:pg17
    env_file: .env
    environment:
      DTK_SECRET_KEY: ""
      POSTGRES_DB: dtk
      POSTGRES_USER: dtk
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres-data:/home/postgres/pgdata/data
    networks: [data]
    mem_limit: 2g
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtk -d dtk"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 1m
    logging: *logging

  redis:
    image: redis:8-alpine
    user: redis
    env_file: .env
    environment:
      DTK_SECRET_KEY: ""
    command:
      - sh
      - -c
      - |
        if [ -z "$$REDIS_PASSWORD" ]; then echo "redis: REDIS_PASSWORD 为空，先填好 .env" >&2; exit 1; fi
        exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --save 60 1 --maxmemory 320mb --maxmemory-policy volatile-lru
    volumes:
      - redis-data:/data
    networks: [data]
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  migrate:
    <<: *app
    command: ["migrate"]
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["api"]
    environment:
      DTK_BIND_HOST: "0.0.0.0"
      DTK_BIND_PORT: "8000"
      DTK_CONSOLE_DIR: /app/web/dist
      DTK_BACKUP_DIR: /var/lib/dtk/backups
      DTK_MEDIA_DIR: /var/lib/dtk/media
    volumes:
      - backup-data:/var/lib/dtk/backups
      - media-data:/var/lib/dtk/media:ro
    ports:
      # 只绑定本机；公网访问要自己加带密码的反向代理和 HTTPS
      - "${DTK_BIND_HOST:-127.0.0.1}:${DTK_BIND_PORT:-8000}:8000"
    networks: [data, edge]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=3) as r:
              sys.exit(0 if r.status == 200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    <<: *app
    command: ["worker"]
    environment:
      DTK_BACKUP_DIR: /var/lib/dtk/backups
    volumes:
      - backup-data:/var/lib/dtk/backups
    networks: [data, edge]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 45s

  downloader:
    # 上游发布的下载器镜像（Docker Hub），固定到与本工具同一上游版本
    image: evil0ctal/douyin_tiktok_download_api-downloader:5.1.7
    env_file: .env
    environment:
      DTK_SECRET_KEY: ""
      DTK_DATABASE_URL: ""
      DTK_REDIS_URL: ""
      DTK_DOWNLOADER_BIND: "0.0.0.0:9100"
      DTK_DOWNLOADER_ROOT: /var/lib/dtk/media
    expose:
      - "9100"
    networks: [edge]
    volumes:
      - media-data:/var/lib/dtk/media
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 2.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "/usr/local/bin/downloader", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging

networks:
  data:
    internal: true
  edge: {}

volumes:
  postgres-data:
  redis-data:
  backup-data:
  media-data:
